data:
  raw_path: data/raw/student_performance_dataset.csv
  target_column: final_grade
  # student_id: identifier, no signal
  # final_exam_score: final_grade is a deterministic bucket of this column
  # (A: 90-100, B: 80-89.9, C: 70-79.9, D: 60-69.9, F: <60), so keeping it
  # as a feature would leak the label and produce a trivially "perfect" model.
  drop_columns:
    - student_id
    - final_exam_score
  test_size: 0.2
  random_state: 42

model:
  type: random_forest
  params:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 2
    random_state: 42

artifacts:
  dir: artifacts
  model_path: artifacts/model.joblib
  onnx_path: artifacts/model.onnx
  metrics_path: artifacts/metrics.json

api:
  host: 0.0.0.0
  port: 5000
  # which artifact backs /predict: "sklearn" or "onnx"
  inference_engine: sklearn
