[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "student-grade-predictor"
version = "0.1.0"
description = "Predicts a student's final letter grade from study/attendance/lifestyle features, served via a Flask API and exportable to ONNX."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.3,<1.6",
    "flask>=3.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "skl2onnx>=1.16",
    "onnxruntime>=1.17",
    "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
